name: Build for OnePlus Ace 6 (op6113l1)

# 手动触发。第一轮先诊断 OPPO 的 stock ramdisk 结构，
# 再尝试打包 —— 顺序故意这样排，失败也能拿到关键信息。
on:
  workflow_dispatch:
    inputs:
      stock_release:
        description: 放 stock 镜像的 Release 标签
        required: true
        default: stock
      stock_asset:
        description: Release 里的文件名
        required: true
        default: recovery_a.img

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build recovery for op6113l1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build the recovery service for the phone
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward

      - name: Build the packer
        run: cargo build --locked --release -p skyward-pack

      - name: Fetch the stock recovery
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.stock_release }}
          ASSET: ${{ inputs.stock_asset }}
        run: |
          mkdir -p stock
          gh release download "$TAG" --pattern "$ASSET" --dir stock --clobber
          ls -l stock
          sha256sum stock/*

      # 关键诊断：stock ramdisk 里到底有没有打包器硬依赖的
      # system/bin/recovery 和 prop.default。没有就得改 Rust 代码。
      - name: Inspect the stock ramdisk
        env:
          ASSET: ${{ inputs.stock_asset }}
        run: |
          set +e
          target/release/skyward-pack list "stock/$ASSET" > ramdisk.txt 2> list.err
          echo "exit=$?"
          echo "===== 前 60 条 ====="
          head -60 ramdisk.txt
          echo "===== 关键路径 ====="
          for p in system/bin/recovery system/bin/adbd prop.default system/bin/sh init; do
            if grep -qE "(^|[[:space:]])${p}$" ramdisk.txt; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          echo "===== system/ 下 ====="
          grep -E "system/" ramdisk.txt | head -40
          echo "===== 行数 ====="
          cat ramdisk.txt | wc -l
          cat list.err

      - name: Pack the recovery
        env:
          ASSET: ${{ inputs.stock_asset }}
        run: |
          target/release/skyward-pack recovery \
            --stock "stock/$ASSET" \
            --binary target/aarch64-linux-android/release/skyward \
            --config devices/op6113l1.toml \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out skyward-op6113l1.img
          ls -l skyward-op6113l1.img
          sha256sum skyward-op6113l1.img
          zip -9 skyward-op6113l1.zip skyward-op6113l1.img
          sha256sum skyward-op6113l1.zip

      - uses: actions/upload-artifact@v7
        with:
          name: skyward-op6113l1
          path: skyward-op6113l1.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
